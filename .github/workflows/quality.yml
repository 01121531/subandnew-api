name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.8'
      - name: Verify frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=critical
          cd default
          bun run typecheck
          bun run lint
          bun run format:check
          bun test
          bun run knip
          bun run build
      - name: Verify backend
        run: |
          go test ./... -count=1
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          # GO-2026-6452 has no fixed excelize release yet. Filter only that
          # advisory from the machine-readable findings; all other findings
          # and scanner errors remain quality-blocking.
          set -o pipefail
          govulncheck -format=json ./... > govulncheck.json
          unexpected=$(jq -r 'select(.finding? != null and .finding.osv != "GO-2026-6452") | .finding.osv' govulncheck.json | sort -u)
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            exit 1
          fi
