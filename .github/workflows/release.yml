name: Release binaries

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'
      - name: Verify frontend
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=critical
          cd default
          bun run typecheck
          bun run lint
          bun run format:check
          bun test
          bun run knip
          bun run build
      - name: Verify backend
        run: |
          go test ./... -count=1
          go vet ./...
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  build:
    needs: quality
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.26.7'
      - name: Build frontend
        shell: bash
        run: |
          cd web
          bun install --frozen-lockfile
          cd default
          bun run build
      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION='${{ github.ref_name }}'
          PLATFORM='${{ matrix.goos }}'
          if [ "$PLATFORM" = 'darwin' ]; then PLATFORM='macos'; fi
          OUTPUT="subandnew-api-${VERSION}-${PLATFORM}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -ldflags "-s -w -X 'github.com/01121531/subandnew-api/common.Version=${VERSION}'" -o "${OUTPUT}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: subandnew-api-${{ matrix.goos }}-${{ matrix.goarch }}
          path: subandnew-api-*

  mailbox-desktop:
    needs: quality
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/mailbox-assistant
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Test and package desktop client
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m mypy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          $env:PYTHONPATH = ''
          $env:PYTHONHOME = ''
          $check = Start-Process -FilePath ./dist/MailboxAssistant/MailboxAssistant.exe -ArgumentList '--self-test' -WindowStyle Hidden -PassThru
          if (-not $check.WaitForExit(120000)) { $check.Kill(); throw 'Desktop runtime check timed out' }
          if ($check.ExitCode -ne 0) { exit $check.ExitCode }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mailbox-assistant-windows
          path: |
            desktop/mailbox-assistant/dist/mailbox-assistant-*.zip
            desktop/mailbox-assistant/dist/mailbox-assistant-*.sha256

  release:
    needs: [build, mailbox-desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: subandnew-api-*
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mailbox-assistant-windows
      - name: Generate release checksums
        shell: bash
        run: |
          sha256sum subandnew-api-*-linux-* > checksums-linux.txt
          sha256sum subandnew-api-*-macos-* > checksums-macos.txt
          sha256sum subandnew-api-*-windows-* > checksums-windows.txt
          sha256sum mailbox-assistant-*.zip > checksums-mailbox-assistant.txt
      - uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          files: |
            subandnew-api-*
            checksums-*.txt
            mailbox-assistant-*.zip
            mailbox-assistant-*.sha256
            LICENSE
            NOTICE
            THIRD-PARTY-LICENSES.md
          generate_release_notes: true
