services:
  control-plane:
    image: ghcr.io/01121531/subandnew-api:latest
    container_name: subandnew-control-plane
    restart: unless-stopped
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      SQL_DSN: postgresql://root:change-me@postgres:5432/subandnew
      REDIS_CONN_STRING: redis://:change-me@redis:6379
      APP_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set to at least 32 random bytes}
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_TRUSTED_URL: ${SESSION_COOKIE_TRUSTED_URL:?SESSION_COOKIE_TRUSTED_URL must be an HTTPS URL}
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      MANAGED_INSTANCE_SECRET_KEY: replace-with-32-byte-standard-base64
      MANAGED_INSTANCE_SECRET_KEY_VERSION: v1
      MANAGED_USAGE_EXPORT_DIR: /data/exports/usage-records
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "change-me"]

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: subandnew
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d subandnew"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
